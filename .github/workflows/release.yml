name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.0.9
        required: true
        default: v2.0.9

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Administrator console
          - Redesigned the console with a grouped sidebar, collapsible navigation, a light glass theme, local country flags, and in-app confirmation dialogs.
          - Replaced the separate sync queue with an address data workspace: status filters, search, sorting, completion-rule badges, and per-country detail tabs for overview, targets, nodes, sources, and history.
          - The overview and country list now show administrative coverage (nodes with addresses) separately from nodes that meet the per-node minimum, matching the completion rules.
          - Added a system status endpoint, visibility-aware polling, and login rate limiting.

          ### OpenAI-compatible translation
          - Accepts a base URL prefix or the full `/chat/completions` URL, previews the actual request URL, and detects the API version on save.
          - New providers start with the built-in default prompt, which can be restored in one click.
          - Added a step-by-step test console that shows the request URL, model, parameters, HTTP status, latency, token usage, model reply, and the provider's error message with keys masked.
          - Credentials marked for review can be tested again and return to service when a test passes; malformed model replies no longer mark a credential for review.
          - Reasoning models get a 120-second deadline that includes broker queueing, so slow but healthy providers are no longer cancelled at 30 seconds.
          - Added an unlimited quota option, which is the default for new OpenAI-compatible credentials.

          ### Synchronization and deployment
          - The sync service publishes its queue snapshot to PostgreSQL, so the console stays responsive while synchronization is busy.
          - Migration retries residential coverage lock timeouts with bounded backoff instead of failing the deployment.
          - The live contract audit accepts the official Hong Kong place-name character 涌.

          ### Documentation and verification
          - Rewrote the README, deployment, API, API key, and development guides in English, Simplified Chinese, and Traditional Chinese, with Docker Compose first and new screenshots.
          - Verified 1,420 JavaScript/TypeScript tests, 109 Python tests, type checks, builds, administrator and UI end-to-end tests, and 500 live address-contract samples for each of the 27 supported countries.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
